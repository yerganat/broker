version: '3.1'

services:
  db_mysql:
    container_name: db_mysql
    image: mysql
    ports:
      - "3306:3306"
    restart: always
    environment:
      MYSQL_USER: admin
      MYSQL_PASSWORD: broker2023
      MYSQL_ROOT_PASSWORD: broker2023
    volumes:
      - /var/lib/mysqld:/var/lib/mysql
  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin
    restart: always
    ports:
      - "8091:80"
    environment:
      - PMA_HOST=db_mysql
    depends_on:
      - db_mysql